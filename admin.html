<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nicks Laboratories | Secure Admin</title><style>
*{box-sizing:border-box}body{font:15px system-ui,Arial;background:#eef5fb;color:#10294a;margin:0}header{background:#071b38;color:white;padding:20px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:16px;box-shadow:0 10px 30px #1232;margin-bottom:20px}label{display:block;font-weight:650;margin:14px 0 5px}input,select,textarea{width:100%;border:1px solid #cad8e7;border-radius:8px;padding:11px;font:inherit}input[type=checkbox]{width:auto}button{background:#1268db;color:white;border:0;border-radius:8px;padding:12px 17px;cursor:pointer;margin:7px 7px 7px 0}button.secondary{background:#456078}button.danger{background:#a8233b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#62758a}.hidden{display:none!important}.product-row{border-top:1px solid #e5edf4;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}#status{white-space:pre-wrap;color:#174b77}img.preview{height:75px;width:75px;object-fit:contain}@media(max-width:700px){.grid{grid-template-columns:1fr}.product-row{align-items:flex-start;flex-direction:column}}</style></head><body>
<header><h1>Nicks Laboratories · Admin</h1><button id="logout" class="secondary hidden">Sign out</button></header><main><p id="status" role="status"></p>
<section id="login" class="panel"><h2>Secure Admin Login</h2><form id="loginForm"><label>Email / Login ID</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2 id="welcome">Product Management</h2><p class="muted">Changes saved here appear on the Products page automatically. Upload up to four PNG, JPEG or WebP images (5 MB each).</p><form id="productForm"><input type="hidden" id="productId"><div class="grid"><div><label>Product Name</label><input id="name" required></div><div><label>Category</label><input id="category" required></div><div><label>Pack size</label><input id="pack"></div><div><label>Ingredients / Composition</label><input id="ingredients"></div></div><label>Description</label><textarea id="description" rows="4"></textarea><label>Upload product images (up to 4)</label><input id="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple><p id="currentImages" class="muted"></p><label><input id="published" type="checkbox" checked> Published</label><div><button type="submit">Save Product</button><button id="clear" type="button" class="secondary">New Product</button></div></form></div><div class="panel"><h2>Products</h2><p class="muted">Import your existing website catalogue once to enable editing here.</p><button id="importExisting" type="button" class="secondary">Import Existing Website Products</button><div id="list"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="products-data.js"></script><script>
(()=>{const cfg=window.NICKS_SUPABASE_CONFIG,$=id=>document.getElementById(id),status=(t)=>$('status').textContent=t;
if(!window.supabase||!cfg){status('Supabase library/config missing.');return}const sb=window.supabase.createClient(cfg.url,cfg.key);let role=null,items=[];
const reset=()=>{$('productForm').reset();$('productId').value='';$('currentImages').textContent='';};
async function check(){const {data:{user}}=await sb.auth.getUser();if(!user){role=null;$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');return}
const {data,error}=await sb.from('admin_roles').select('role').eq('user_id',user.id).single();if(error||!data){status('This account has no admin role. Ask the Super Admin to grant access in Supabase.');await sb.auth.signOut();return}role=data.role;$('welcome').textContent=role==='super_admin'?'Super Admin · Products':'Product Admin · Products';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');status('Signed in as '+user.email);await load()}
async function load(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){status(error.message);return}items=data||[];$('list').replaceChildren();for(const p of items){const row=document.createElement('div');row.className='product-row';const label=document.createElement('div');label.textContent=p.name+' · '+p.category+(p.published?' · Published':' · Draft');const actions=document.createElement('div');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{for(const k of ['name','category','pack','ingredients','description'])$(k).value=p[k]||'';$('productId').value=p.id;$('published').checked=p.published;$('currentImages').textContent=(p.images||[]).length+' existing image(s). New uploads are added until 4 total.';window.scrollTo({top:0,behavior:'smooth'})};actions.append(edit);if(role==='super_admin'){const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+p.name+'?'))return;const {error}=await sb.from('products').delete().eq('id',p.id);status(error?error.message:'Deleted');if(!error)await load()};actions.append(del)}row.append(label,actions);$('list').append(row)}}
$('importExisting').onclick=async()=>{if(role!=='super_admin'){status('Super Admin required');return}const originals=Array.isArray(window.NICKS_PRODUCTS)?window.NICKS_PRODUCTS:[];if(!originals.length){status('No existing catalogue found');return}if(!confirm('Import existing website products into Supabase? Existing admin products will not be overwritten.'))return;status('Importing existing catalogue...');const existingNames=new Set(items.map(p=>(p.name||'').trim().toLowerCase()));const toImport=originals.filter(p=>!existingNames.has((p.name||'').trim().toLowerCase())).map(p=>({name:p.name,category:p.category||'Other',pack:p.pack||'',ingredients:p.ingredients||'',description:p.description||'',images:(Array.isArray(p.images)?p.images:[p.image]).filter(Boolean).slice(0,4),published:p.published!==false}));if(!toImport.length){status('All products already imported');return}const {error}=await sb.from('products').insert(toImport);if(error){status('Import failed: '+error.message);return}status('Imported '+toImport.length+' products. You can now edit them below.');await load()};
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status(error.message);return}await check()};$('logout').onclick=async()=>{await sb.auth.signOut();status('Signed out');await check()};$('clear').onclick=reset;
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('productId').value;const existing=items.find(p=>p.id===id);const images=[...(existing?.images||[])];const files=Array.from($('photos').files);if(images.length+files.length>4){status('Maximum four images per product.');return}status('Uploading / saving...');for(const f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024){status('Images must be PNG, JPG or WebP, max 5 MB each.');return}const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const path=crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('product-images').upload(path,f,{contentType:f.type});if(error){status('Image upload failed: '+error.message);return}images.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl)}
const data={name:$('name').value.trim(),category:$('category').value.trim(),pack:$('pack').value.trim(),ingredients:$('ingredients').value.trim(),description:$('description').value.trim(),images,published:$('published').checked,updated_at:new Date().toISOString()};const q=id?sb.from('products').update(data).eq('id',id):sb.from('products').insert(data);const {error}=await q;if(error){status('Save failed: '+error.message);return}status('Saved successfully. Live Products page will show the change on refresh.');reset();await load()};check();})();
</script></body></html>
